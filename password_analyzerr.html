<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Analyzer</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #a8c0ff, #3f2b96);
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .input-group {
      margin-top: 20px;
      margin-bottom: 15px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #6c5ce7;
    }
    .meter-container {
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s, background-color 0.3s;
    }
    .status-text {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 15px;
      color: #555;
    }
    .metrics {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #444;
    }
    .metrics p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Password Strength Analyzer</h2>
    
    <div class="input-group">
      <input type="password" id="passwordInput" placeholder="Enter password to analyze...">
    </div>

    <div class="meter-container">
      <div class="meter-bar" id="meterBar"></div>
    </div>
    
    <div class="status-text" id="statusText">Strength: Waiting for input...</div>

    <div class="metrics">
      <p><strong>Length:</strong> <span id="lengthVal">0</span> characters</p>
      <p><strong>Entropy:</strong> <span id="entropyVal">0</span> bits</p>
      <p><strong>Score:</strong> <span id="scoreVal">0</span> / 100</p>
    </div>
  </div>

  <script>
    const COMMON_PASSWORDS = ["admin", "password", "123456", "pass1234", "qwerty", "letmein"];

    const passwordInput = document.getElementById('passwordInput');
    const meterBar = document.getElementById('meterBar');
    const statusText = document.getElementById('statusText');
    const lengthVal = document.getElementById('lengthVal');
    const entropyVal = document.getElementById('entropyVal');
    const scoreVal = document.getElementById('scoreVal');

    passwordInput.addEventListener('input', () => {
      const pwd = passwordInput.value;
      const len = pwd.length;

      if (len === 0) {
        meterBar.style.width = '0%';
        statusText.textContent = 'Strength: Waiting for input...';
        lengthVal.textContent = '0';
        entropyVal.textContent = '0';
        scoreVal.textContent = '0';
        return;
      }

      // Calculate Entropy
      let poolSize = 0;
      if (/[a-z]/.test(pwd)) poolSize += 26;
      if (/[A-Z]/.test(pwd)) poolSize += 26;
      if (/\d/.test(pwd)) poolSize += 10;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) poolSize += 32;

      let entropy = poolSize > 0 ? (len * Math.log2(poolSize)).toFixed(2) : 0;

      // Calculate Score
      let score = 0;
      let verdict = "Weak";
      
      if (COMMON_PASSWORDS.includes(pwd.toLowerCase())) {
        score = 0;
        verdict = "Weak (Common Password)";
      } else {
        if (len >= 12) score += 40;
        else if (len >= 8) score += 20;

        if (/[a-z]/.test(pwd)) score += 15;
        if (/[A-Z]/.test(pwd)) score += 15;
        if (/\d/.test(pwd)) score += 15;
        if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) score += 15;

        if (score >= 80) verdict = "Very Strong";
        else if (score >= 60) verdict = "Strong";
        else if (score >= 40) verdict = "Moderate";
        else verdict = "Weak";
      }

      // Update UI
      lengthVal.textContent = len;
      entropyVal.textContent = entropy;
      scoreVal.textContent = score;
      statusText.textContent = `Strength: ${verdict}`;

      meterBar.style.width = `${Math.min(score, 100)}%`;
      if (score < 40) meterBar.style.backgroundColor = '#ff4757';
      else if (score < 60) meterBar.style.backgroundColor = '#ffa502';
      else if (score < 80) meterBar.style.backgroundColor = '#2ed573';
      else meterBar.style.backgroundColor = '#1e90ff';
    });
  </script>
</body>
</html>
